name: roadvision_app
description: "RoadVision AI - Mobile App for Citizen Road Damage Reporting & Municipal Admin Inspection"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  image_picker: ^1.0.4
  geolocator: ^10.1.0
  flutter_map: ^6.0.1
  latlong2: ^0.9.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.18.1
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
